name: Uppdatera kungens portfölj

on:
  schedule:
    # Börsdagar under handelstid (Stockholm 09–17:30 ≈ 07–16 UTC): var 15:e minut.
    - cron: "*/15 7-16 * * 1-5"
    # Övrig tid: nyhetsskanning varje timme.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/ledger.json", "data/securities.json", "scripts/**"]

permissions:
  contents: write

concurrency:
  group: update-portfolio
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node scripts/update.mjs
      - name: Spara nya data
        run: |
          git config user.name "kungens-portfolj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Inga ändringar"; exit 0; fi
          git commit -m "Uppdatera portfölj $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
